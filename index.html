<!DOCTYPE html>
<html>
<head>
    <title>My Device Tools</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        .button { 
            display: block; width: 100%; max-width: 300px; margin: 10px auto;
            padding: 15px; background: #0070f3; color: white; 
            text-decoration: none; border-radius: 8px; font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>System Shortcuts</h2>
    
    <a href="intent:#Intent;action=android.settings.SETTINGS;end" class="button">Open Settings</a>

    <a href="intent:#Intent;action=android.settings.WIFI_SETTINGS;end" class="button">Open Wi-Fi</a>

    <a href="intent:#Intent;action=android.settings.ADD_ACCOUNT_SETTINGS;end" class="button">Add Google Account</a>

</body>
</html>
